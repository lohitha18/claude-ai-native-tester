name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-eval.txt -r requirements-quality.txt

      - name: Lint Python
        run: ruff check scripts

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile starter app
        run: |
          mkdir -p /tmp/payment-start/classes
          javac -d /tmp/payment-start/classes $(find starter-repo/src/main/java -name '*.java')

      - name: Start starter app and wait for console readiness
        shell: bash
        run: |
          java -cp /tmp/payment-start/classes com.technova.payment.Main > /tmp/payment-start.log 2>&1 &
          echo $! > /tmp/payment-start.pid
          for attempt in $(seq 1 30); do
            if grep -q 'Payment application starter project' /tmp/payment-start.log; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/payment-start.pid)" 2>/dev/null; then
              cat /tmp/payment-start.log
              exit 1
            fi
            sleep 1
          done
          echo 'Starter app did not reach console readiness within 30 seconds.'
          cat /tmp/payment-start.log
          exit 1

      - name: Run pytest
        env:
          BASE_URL: ""
        run: |
          mkdir -p test-results
          pytest -v \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --output=test-results

      - name: Sanitize reports before upload
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dirs = (Path('test-results'), Path('playwright-report'), Path('reports'))
          patterns = (
              re.compile(r'(?i)(api[_-]?key|access[_-]?token|password|secret|bearer)[\s=:]+[^\s,&]+'),
              re.compile(r'(?<!\d)(?:\d[ -]*?){13,19}(?!\d)'),
              re.compile(r'(?i)\b(?:sk|pk)[-_][A-Za-z0-9_-]{8,}\b'),
          )

          for directory in dirs:
              if not directory.exists():
                  continue
              for path in directory.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.txt', '.log', '.json', '.jsonl', '.csv', '.html', '.xml', '.md'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for pattern in patterns:
                      text = pattern.sub('[REDACTED]', text)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Upload test and report artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: python-test-evidence
          if-no-files-found: warn
          path: |
            test-results
            playwright-report
            reports

  rag-evaluation:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install RAG evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-eval.txt

      - name: Lint RAG scripts
        run: |
          python -m pip install ruff==0.14.10
          ruff check scripts/build_index.py scripts/run_rag_eval.py

      - name: Build RAG index
        run: python scripts/build_index.py --build

      - name: Run RAG evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAGAS_EVAL_MODEL: ${{ vars.RAGAS_EVAL_MODEL || 'gpt-4o-mini' }}
          RAGAS_EVAL_EMBEDDING_MODEL: ${{ vars.RAGAS_EVAL_EMBEDDING_MODEL || 'text-embedding-3-small' }}
        run: python scripts/run_rag_eval.py

      - name: Fail if RAG evidence is missing
        run: |
          test -f reports/ragas-results.csv
          test -f reports/ragas-examples.jsonl
          test -f reports/ragas-baseline.json

      - name: Fail on RAG evidence or safety regressions
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          baseline = json.loads(Path('reports/ragas-baseline.json').read_text(encoding='utf-8'))

          if baseline.get('unanswerable_fabrication_count', 1) != 0:
              raise SystemExit('A fabricated answer was produced for an unanswerable RAG case.')

          if float(baseline.get('critical_safety_pass_percent', 0)) != 100.0:
              raise SystemExit('A critical RAG safety case regressed.')

          executed = baseline.get('ragas_status') == 'executed'
          if os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch' and not executed:
              raise SystemExit('Real Ragas metrics were not executed; configure OPENAI_API_KEY and rerun workflow_dispatch.')

          if executed:
              thresholds = baseline['thresholds']
              for metric in ('faithfulness', 'context_precision', 'context_recall'):
                  value = baseline.get(metric)
                  if value == '' or value is None:
                      raise SystemExit(f'Missing Ragas metric: {metric}')
                  if float(value) < float(thresholds[metric]):
                      raise SystemExit(f'{metric}={value} is below threshold {thresholds[metric]}')
          PY

      - name: Sanitize RAG reports before upload
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path('reports').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.txt', '.log', '.json', '.jsonl', '.csv', '.md'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              text = re.sub(r'(?i)(api[_-]?key|access[_-]?token|password|secret|bearer)[\s=:]+[^\s,&]+', '[REDACTED]', text)
              text = re.sub(r'(?<!\d)(?:\d[ -]*?){13,19}(?!\d)', '[REDACTED]', text)
              text = re.sub(r'(?i)\b(?:sk|pk)[-_][A-Za-z0-9_-]{8,}\b', '[REDACTED]', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Upload RAG evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rag-evaluation-evidence
          if-no-files-found: error
          path: reports
